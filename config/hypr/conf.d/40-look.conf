general {
    gaps_in = $gap_inner
    gaps_out = $gap_outer
    border_size = $border
    col.active_border = $accent $accent_warm 45deg
    col.inactive_border = $surface_high
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = $radius
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = $background
    }
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        vibrancy = 0.16
    }
}

animations {
    enabled = true
    bezier = rainEase, 0.2, 0.9, 0.2, 1.0
    bezier = rainPop, 0.25, 1.35, 0.5, 1.0
    animation = windows, 1, 4, rainPop, popin 88%
    animation = windowsOut, 1, 3, rainEase, popin 92%
    animation = border, 1, 6, default
    animation = fade, 1, 4, rainEase
    animation = workspaces, 1, 4, rainEase, slidefade 18%
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $background
}

cursor {
    inactive_timeout = 4
    hide_on_key_press = true
}
