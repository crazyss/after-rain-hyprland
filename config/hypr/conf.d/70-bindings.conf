$mainMod = SUPER

# Applications and session
bindd = $mainMod, Return, Open terminal, exec, $terminal
bindd = $mainMod, Space, Open launcher, exec, $menu
bindd = $mainMod, K, Open After Rain control center, exec, $afterRainBin/after-rain-menu
bindd = $mainMod SHIFT, K, Search keybindings, exec, $afterRainBin/after-rain-cheatsheet
bindd = $mainMod, E, Open files, exec, $fileManager
bindd = $mainMod SHIFT, F, Open files alternate, exec, $fileManager
bindd = $mainMod SHIFT, B, Open browser, exec, $browser
bindd = $mainMod, C, Close window, killactive
bindd = $mainMod, Q, Close window alternate, killactive
bindd = $mainMod, F, Toggle fullscreen, fullscreen
bindd = $mainMod, V, Toggle floating, togglefloating
bindd = $mainMod, P, Toggle pseudotile, pseudo
bindd = $mainMod, J, Toggle split, layoutmsg, togglesplit
bindd = $mainMod CTRL, L, Lock session, exec, $locker
bindd = $mainMod, Escape, Power menu, exec, wlogout -b 3

# Desktop controls
bindd = $mainMod, N, Toggle notifications, exec, swaync-client -t -sw
bindd = $mainMod, comma, Dismiss notification, exec, swaync-client --close-latest
bindd = $mainMod SHIFT, comma, Clear notifications, exec, swaync-client -C
bindd = $mainMod CTRL, comma, Toggle do not disturb, exec, swaync-client -d
bindd = $mainMod SHIFT, Space, Toggle bar, exec, pkill -SIGUSR1 waybar
bindd = $mainMod CTRL, Space, Next wallpaper, exec, $afterRainBin/after-rain-wallpaper next
bindd = $mainMod CTRL, A, Audio mixer, exec, kitty --class after-rain-audio wiremix
bindd = $mainMod CTRL, W, Wi-Fi, exec, kitty --class after-rain-network nmtui
bindd = $mainMod CTRL, B, Bluetooth, exec, kitty --class after-rain-bluetooth bluetui
bindd = CTRL, Space, Toggle English and Chinese input, exec, $afterRainBin/after-rain-input-toggle

# Focus, movement and resize
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d
bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d
bindd = $mainMod CTRL, left, Resize narrower, resizeactive, -40 0
bindd = $mainMod CTRL, right, Resize wider, resizeactive, 40 0
bindd = $mainMod CTRL, up, Resize shorter, resizeactive, 0 -40
bindd = $mainMod CTRL, down, Resize taller, resizeactive, 0 40

bindd = $mainMod, 1, Workspace 1 · Lin Wan, exec, $afterRainBin/after-rain-workspace 1
bindd = $mainMod, 2, Workspace 2 · Aoi Takamori, exec, $afterRainBin/after-rain-workspace 2
bindd = $mainMod, 3, Workspace 3 · Seo Ji-an, exec, $afterRainBin/after-rain-workspace 3
bindd = $mainMod, 4, Workspace 4 · Clara Reed, exec, $afterRainBin/after-rain-workspace 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10
bindd = $mainMod SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move to workspace 10, movetoworkspace, 10
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move to scratchpad, movetoworkspace, special:magic

# Screenshots
bindd = , Print, Capture region, exec, hyprshot -m region --clipboard-only
bindd = ALT, Print, Capture window, exec, hyprshot -m window --clipboard-only
bindd = SHIFT, Print, Capture monitor, exec, hyprshot -m output --clipboard-only

# Mouse and hardware keys
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl prev
