general {
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/current.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(216, 222, 233, 1.0)
    font_size = 92
    font_family = Noto Sans
    position = -900, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %Y-%m-%d"
    color = rgba(127, 140, 157, 1.0)
    font_size = 20
    font_family = Noto Sans CJK SC
    position = -900, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgba(114, 183, 200, 0.8)
    inner_color = rgba(11, 16, 24, 0.82)
    font_color = rgba(216, 222, 233, 1.0)
    fade_on_empty = false
    placeholder_text = <i>输入密码解锁</i>
    fail_text = <i>$FAIL · 再试一次</i>
    position = -900, -40
    halign = center
    valign = center
}
