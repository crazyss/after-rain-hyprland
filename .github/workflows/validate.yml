name: validate
on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for script in bin/* scripts/*.sh; do
            bash -n "$script"
          done
      - name: JSON
        run: python3 -m json.tool config/swaync/config.json >/dev/null
      - name: Secret patterns
        run: ./scripts/scan-secrets.sh
